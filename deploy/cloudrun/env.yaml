# Non-secret settings for the Cloud Run service and job (--env-vars-file).
# Secrets (DATABASE_URL, SECRET_ENCRYPTION_KEY, APP_PASSWORD, PLAID_CLIENT_ID,
# PLAID_SECRET) come from Secret Manager instead; see docs/deploy-cloud-run.md.
PLAID_ENV: production
PLAID_COUNTRY_CODES: US,CA
PLAID_PRODUCTS: transactions
PLAID_ADDITIONAL_CONSENTED_PRODUCTS: investments
# Set after the first deploy to the service URL, exactly as registered in the
# Plaid dashboard (Team Settings -> API -> Allowed redirect URIs).
PLAID_REDIRECT_URI: "https://pkm-erfgn57lha-uw.a.run.app/"
# Local calendar dates for "today": snapshots, ranges, import gap checks.
TZ: America/Vancouver
# The daily Cloud Run Job does syncing; the service scales to zero, so an
# in-process interval sync would never fire reliably.
SYNC_INTERVAL_HOURS: "0"
